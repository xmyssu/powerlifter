<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training log</title>
<meta name="description" content="A powerlifting training log — estimated maxes, volume and consistency, updated automatically after every session.">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* ==========================================================================
   dash.html — the public dashboard
   --------------------------------------------------------------------------
   Reads data/stats.json, which the training app publishes after every sync.
   Deliberately standalone: no build step, no framework, no external request,
   so it stays fast and keeps working whatever happens to the app itself.

   Tokens mirror app.css so this reads as the same product. The three series
   colours are NOT the app's status colours — they were picked and validated as
   a categorical set (lightness band, chroma floor, colourblind separation and
   contrast against the card surface, in both modes).
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0b0b0c; --surface: #141416; --surface-2: #1d1d20; --surface-3: #26262b;
  --line: #2e2e34; --line-soft: #212126;
  --text: #f0eee9; --text-2: #a5a39e; --text-3: #6f6d69;
  --accent: #ff5a1f; --accent-wash: rgba(255,90,31,.14);
  --good: #3ddc84; --bad: #ff4d4d; --warn: #ffc53d;

  /* categorical series — validated for the dark card surface */
  --s1: #d95926;  /* squat */
  --s2: #3987e5;  /* bench */
  --s3: #d55181;  /* deadlift */

  /* sequential ramp, one hue, low→high */
  --h0: #1d1d20; --h1: #5c2410; --h2: #8f3616; --h3: #c1481d; --h4: #ff6a30;

  --r-sm: 8px; --r: 12px; --r-lg: 18px; --r-xl: 24px;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, "Roboto Mono", monospace;
  --shadow: 0 2px 6px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.28);
  --maxw: 1080px;
}

/* Light is a selected set of steps, not an inverted flip. */
@media (prefers-color-scheme: light) {
  :root:where(:not([data-theme="dark"])) {
    --bg: #f4f2ee; --surface: #ffffff; --surface-2: #f0ede7; --surface-3: #e4e0d8;
    --line: #d8d3c9; --line-soft: #e7e3da;
    --text: #16151a; --text-2: #56534d; --text-3: #8b8781;
    --accent: #d8410a; --accent-wash: rgba(216,65,10,.10);
    --good: #12833f; --bad: #c22020; --warn: #9a6800;
    --s1: #eb6834; --s2: #2a78d6; --s3: #c94f7c;
    --h0: #f0ede7; --h1: #f8d3c2; --h2: #f2a982; --h3: #e87243; --h4: #c9430f;
    --shadow: 0 1px 3px rgba(20,18,14,.10), 0 8px 24px rgba(20,18,14,.08);
  }
}
:root[data-theme="light"] {
  --bg: #f4f2ee; --surface: #ffffff; --surface-2: #f0ede7; --surface-3: #e4e0d8;
  --line: #d8d3c9; --line-soft: #e7e3da;
  --text: #16151a; --text-2: #56534d; --text-3: #8b8781;
  --accent: #d8410a; --accent-wash: rgba(216,65,10,.10);
  --good: #12833f; --bad: #c22020; --warn: #9a6800;
  --s1: #eb6834; --s2: #2a78d6; --s3: #c94f7c;
  --h0: #f0ede7; --h1: #f8d3c2; --h2: #f2a982; --h3: #e87243; --h4: #c9430f;
  --shadow: 0 1px 3px rgba(20,18,14,.10), 0 8px 24px rgba(20,18,14,.08);
}

body {
  font-family: var(--sans); background: var(--bg); color: var(--text);
  font-size: 16px; line-height: 1.45; min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  padding: max(20px, env(safe-area-inset-top)) 16px 64px;
}
.wrap { max-width: var(--maxw); margin: 0 auto; }

/* ---- header ---- */
.top { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
.top__id { flex: 1 1 260px; min-width: 0; }
h1 { font-size: clamp(1.6rem, 5vw, 2.3rem); line-height: 1.1; letter-spacing: -.02em; font-weight: 700; }
.sub { color: var(--text-2); font-size: .9rem; margin-top: 6px; }
.controls { display: flex; gap: 8px; flex: 0 0 auto; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button {
  font: inherit; font-size: .8rem; font-weight: 600; border: 0; cursor: pointer;
  background: none; color: var(--text-2); padding: 6px 13px; border-radius: 999px;
  min-height: 34px; transition: background .15s, color .15s;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- layout ---- */
.eyebrow {
  font-size: .72rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
  color: var(--text-3); margin: 34px 0 12px;
}
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 18px; box-shadow: var(--shadow);
}
.grid { display: grid; gap: 14px; }
.grid--lifts { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.grid--2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }

/* ---- hero lift tiles ---- */
.lift__head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
.lift__name { font-size: .82rem; font-weight: 650; color: var(--text-2); letter-spacing: .01em; }
.lift__val { font-family: var(--mono); font-size: clamp(2rem, 7vw, 2.6rem); font-weight: 700; letter-spacing: -.03em; line-height: 1.05; }
.lift__val small { font-size: .42em; font-weight: 600; color: var(--text-3); margin-left: 4px; letter-spacing: 0; }
.delta { display: inline-flex; align-items: center; gap: 4px; font-size: .8rem; font-weight: 650; margin-top: 4px; }
.delta--up { color: var(--good); } .delta--down { color: var(--bad); } .delta--flat { color: var(--text-3); }
.lift__foot { font-size: .74rem; color: var(--text-3); margin-top: 8px; }
.spark { margin-top: 10px; display: block; width: 100%; height: 40px; overflow: visible; }

/* ---- stats row ---- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 12px; }
.stat__k { font-size: .7rem; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
.stat__v { font-family: var(--mono); font-size: 1.4rem; font-weight: 700; letter-spacing: -.02em; }
.stat__s { font-size: .72rem; color: var(--text-3); }

/* ---- last session ---- */
.row-between { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.pill {
  font-size: .72rem; font-weight: 650; padding: 3px 9px; border-radius: 999px;
  background: var(--surface-3); color: var(--text-2); white-space: nowrap;
}
.worklist { margin-top: 16px; border-top: 1px solid var(--line-soft); }
.work { display: flex; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
.work:last-child { border-bottom: 0; }
.work__n { font-weight: 600; font-size: .9rem; }
.work__d { font-family: var(--mono); font-size: .82rem; color: var(--text-2); text-align: right; }
.prs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.pr {
  display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 650;
  background: var(--accent-wash); color: var(--accent); padding: 5px 11px; border-radius: 999px;
}

/* ---- charts ---- */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; font-size: .8rem; color: var(--text-2); font-weight: 600; }
.grid-line { stroke: var(--line-soft); stroke-width: 1; }
.axis { fill: var(--text-3); font-size: 11px; font-family: var(--sans); }
.axis--mono { font-family: var(--mono); }
.tip {
  position: absolute; left: 50%; top: 0; pointer-events: none; opacity: 0; transition: opacity .12s;
  background: var(--surface-3); border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 8px 11px; font-size: .78rem; box-shadow: var(--shadow); z-index: 5;
  min-width: 120px; transform: translate(-50%, -100%);
}
.tip[data-on="1"] { opacity: 1; }
.tip__t { font-weight: 700; margin-bottom: 5px; font-size: .74rem; color: var(--text-2); }
.tip__r { display: flex; align-items: center; gap: 7px; justify-content: space-between; }
.tip__r b { font-family: var(--mono); font-weight: 700; }
.crosshair { stroke: var(--text-3); stroke-width: 1; stroke-dasharray: 3 3; }

/* ---- heatmap ---- */
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr);
  gap: 3px; justify-content: start; overflow-x: auto; padding-bottom: 4px; }
.heat i { width: 100%; aspect-ratio: 1; border-radius: 3px; background: var(--h0); display: block; min-width: 11px; }
.heat__scale { display: flex; align-items: center; gap: 5px; font-size: .72rem; color: var(--text-3); margin-top: 12px; }
.heat__scale i { width: 13px; height: 13px; border-radius: 3px; display: block; }

/* ---- table ---- */
.tablewrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
table { border-collapse: collapse; width: 100%; font-size: .86rem; min-width: 460px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
th { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); font-weight: 700; }
td.num, th.num { text-align: right; font-family: var(--mono); }
tbody tr:last-child td { border-bottom: 0; }

.note { font-size: .78rem; color: var(--text-3); margin-top: 12px; line-height: 1.5; }
.empty { text-align: center; padding: 60px 20px; color: var(--text-2); }
footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line-soft); font-size: .76rem; color: var(--text-3); line-height: 1.6; }
a { color: var(--accent); }

@media (max-width: 520px) {
  .card { padding: 15px; border-radius: var(--r); }
  .tablewrap { margin: 0 -15px; padding: 0 15px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="empty">Loading…</div>
</div>

<script type="module">
/* ==========================================================================
   Rendering. Everything is derived from data/stats.json; nothing is fetched
   from anywhere else, so the page has no dependency that can rot or go down.
   ========================================================================== */

const KG_PER_LB = 0.45359237;
const LIFT_COLOR = { squat: 'var(--s1)', bench: 'var(--s2)', deadlift: 'var(--s3)' };

let DATA = null;
let unit = 'kg';   // display unit; the file is always kilos

/* ---- small helpers ---------------------------------------------------- */

const $ = (sel, root = document) => root.querySelector(sel);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const toDisplay = (kg) => (kg == null ? null : unit === 'kg' ? kg : kg / KG_PER_LB);
const fmt = (kg, dp = 1) => {
  const v = toDisplay(kg);
  if (v == null) return '—';
  return (Math.round(v * 10 ** dp) / 10 ** dp).toLocaleString(undefined, { maximumFractionDigits: dp });
};
/** Axis-sized numbers: 0, 4.6k, 18k — never "0k". */
const compact = (v) => {
  if (v == null) return '';
  if (v === 0) return '0';
  if (Math.abs(v) < 1000) return String(Math.round(v));
  if (Math.abs(v) < 10000) return `${(v / 1000).toFixed(1)}k`;
  return `${Math.round(v / 1000)}k`;
};

const fmtInt = (kg) => {
  const v = toDisplay(kg);
  return v == null ? '—' : Math.round(v).toLocaleString();
};
const dayMs = 864e5;
const parseDate = (iso) => new Date(`${iso}T00:00:00`);
const fmtDate = (iso, opts = { day: 'numeric', month: 'short' }) =>
  iso ? parseDate(iso).toLocaleDateString(undefined, opts) : '—';

function relTime(iso) {
  if (!iso) return 'never';
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 2) return 'just now';
  if (mins < 60) return `${mins} minutes ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs} hour${hrs === 1 ? '' : 's'} ago`;
  const days = Math.round(hrs / 24);
  return days === 1 ? 'yesterday' : `${days} days ago`;
}

/* ---- generic chart scaffolding ---------------------------------------- */

const svgNS = 'http://www.w3.org/2000/svg';

/**
 * A viewBox sized to the container, rather than a fixed one scaled to fit.
 *
 * With a fixed viewBox and an explicit height the browser letterboxes: the chart
 * scales to the height and leaves the rest of the card empty. Measuring instead
 * means one viewBox unit is one CSS pixel, so charts fill their card, text stays
 * the size it was designed at, and nothing is stretched. render() re-runs on
 * resize to keep it true.
 */
function plotWidth(host, min = 280) {
  return Math.max(min, Math.round(host.clientWidth || 760));
}
function el(name, attrs = {}, parent = null) {
  const node = document.createElementNS(svgNS, name);
  for (const [k, v] of Object.entries(attrs)) if (v != null) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
}

/** Nice round tick values covering [lo, hi] in about `count` steps. */
function ticks(lo, hi, count = 4) {
  if (!(hi > lo)) return [lo];
  const raw = (hi - lo) / count;
  const mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw) || mag * 10;
  const out = [];
  for (let t = Math.ceil(lo / step) * step; t <= hi + step * 0.001; t += step) out.push(+t.toFixed(6));
  return out;
}

/**
 * Attach a hover layer. `hit` maps a client x within the plot to an index; the
 * handler paints. Pointer events cover mouse and touch with one path.
 */
function hoverable(svg, tip, { onMove, onLeave }) {
  const handle = (e) => {
    const box = svg.getBoundingClientRect();
    const vb = svg.viewBox.baseVal;
    const x = ((e.clientX - box.left) / box.width) * vb.width;
    const y = ((e.clientY - box.top) / box.height) * vb.height;
    onMove(x, y, box);
  };
  svg.addEventListener('pointermove', handle);
  svg.addEventListener('pointerdown', handle);
  svg.addEventListener('pointerleave', () => { tip.dataset.on = '0'; onLeave?.(); });
}

function placeTip(tip, svg, box, vx, vy) {
  const vb = svg.viewBox.baseVal;
  const scale = box.width / vb.width;
  const host = tip.offsetParent?.getBoundingClientRect() || box;
  tip.dataset.on = '1';
  // The tip is centred on its anchor, so near either edge half of it would hang
  // outside the card — on a phone that means half the numbers are unreadable.
  const half = tip.offsetWidth / 2;
  const want = box.left - host.left + vx * scale;
  tip.style.left = `${Math.max(half + 4, Math.min(host.width - half - 4, want))}px`;
  tip.style.top = `${box.top - host.top + vy * scale - 12}px`;
}

/* ---- 1. hero lift tiles ---------------------------------------------- */

function liftTile(l) {
  const color = LIFT_COLOR[l.lift];
  const d = l.change28;
  const cls = d == null || Math.abs(d) < 0.05 ? 'flat' : d > 0 ? 'up' : 'down';
  const arrow = cls === 'up' ? '▲' : cls === 'down' ? '▼' : '–';
  const deltaTxt = d == null ? 'not enough history yet'
    : cls === 'flat' ? 'level over 28 days'
    : `${d > 0 ? '+' : '−'}${fmt(Math.abs(d))} ${unit} in 28 days`;

  return `<div class="card">
    <div class="lift__head"><span class="dot" style="background:${color}"></span>
      <span class="lift__name">${esc(l.label)}</span></div>
    <div class="lift__val">${l.e1rm == null ? '—' : fmt(l.e1rm, 1)}<small>${unit}</small></div>
    <div class="delta delta--${cls}"><span aria-hidden="true">${arrow}</span>
      <span>${esc(deltaTxt)}</span></div>
    ${sparkSVG(l.trend, color)}
    <div class="lift__foot">${l.tested != null
      ? `Estimated from your sets. Tested max ${fmt(l.tested)} ${unit}.`
      : 'Estimated from your logged sets.'}</div>
  </div>`;
}

function sparkSVG(trend, color) {
  const pts = (trend || []).filter((p) => !p.deload && !p.soft && p.value > 0);
  if (pts.length < 2) return '<div class="spark"></div>';
  const W = 200, H = 40, lo = Math.min(...pts.map((p) => p.value)), hi = Math.max(...pts.map((p) => p.value));
  const span = hi - lo || 1;
  const x = (i) => (i / (pts.length - 1)) * W;
  const y = (v) => H - 3 - ((v - lo) / span) * (H - 8);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
  const area = `${line} L${W},${H} L0,${H} Z`;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${area}" fill="${color}" opacity=".13"></path>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
  </svg>`;
}

function isoWeekKey(iso) {
  const d = parseDate(iso);
  const day = (d.getDay() + 6) % 7;          // Monday = 0
  d.setDate(d.getDate() - day);
  return d.toISOString().slice(0, 10);
}

/* ---- 2. estimated 1RM over time -------------------------------------- */

function trendChart(host) {
  const series = DATA.lifts
    .map((l) => ({ ...l, pts: (l.trend || []).filter((p) => p.value > 0) }))
    .filter((s) => s.pts.length);
  if (!series.length) { host.innerHTML = '<p class="note">No sessions logged yet.</p>'; return; }

  const all = series.flatMap((s) => s.pts);
  const dates = [...new Set(all.map((p) => p.date))].sort();
  const t0 = parseDate(dates[0]).getTime();
  const t1 = parseDate(dates[dates.length - 1]).getTime();
  const spanT = Math.max(t1 - t0, dayMs);

  // Hard estimates set the scale; a deload dip must not squash the whole axis.
  const hard = all.filter((p) => !p.deload && !p.soft);
  const pool = hard.length ? hard : all;
  const vLo = Math.min(...pool.map((p) => p.value)) * 0.94;
  const vHi = Math.max(...pool.map((p) => p.value)) * 1.04;

  const W = plotWidth(host), H = 320;
  // The right gutter holds the direct labels; on a narrow screen it has to give
  // some of that back to the plot or the lines are squeezed into half the card.
  const M = { t: 14, r: W < 420 ? 60 : 78, b: 34, l: W < 420 ? 34 : 46 };
  const px = (iso) => M.l + ((parseDate(iso).getTime() - t0) / spanT) * (W - M.l - M.r);
  const py = (v) => M.t + (1 - (v - vLo) / (vHi - vLo)) * (H - M.t - M.b);

  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img',
    'aria-label': `Estimated one-rep max over time for ${series.map((s) => s.label).join(', ')}, in kilograms.` });

  // y grid + labels
  for (const t of ticks(vLo, vHi, 6)) {
    el('line', { x1: M.l, x2: W - M.r, y1: py(t), y2: py(t), class: 'grid-line' }, svg);
    const lab = el('text', { x: M.l - 8, y: py(t) + 4, class: 'axis axis--mono', 'text-anchor': 'end' }, svg);
    lab.textContent = Math.round(toDisplay(t));
  }
  // x labels: first, last, and a middle one
  const xLabels = dates.length > 2 ? [dates[0], dates[Math.floor(dates.length / 2)], dates[dates.length - 1]] : dates;
  for (const d of xLabels) {
    const lab = el('text', { x: px(d), y: H - 12, class: 'axis', 'text-anchor': 'middle' }, svg);
    lab.textContent = fmtDate(d);
  }

  const endLabels = [];
  for (const s of series) {
    const color = LIFT_COLOR[s.lift];
    const path = s.pts.map((p, i) => `${i ? 'L' : 'M'}${px(p.date).toFixed(1)},${py(p.value).toFixed(1)}`).join(' ');
    el('path', { d: path, fill: 'none', stroke: color, 'stroke-width': 2,
      'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'vector-effect': 'non-scaling-stroke' }, svg);

    // A hollow marker means "the app does not fully trust this estimate" —
    // a deload week, or a set too high-rep to extrapolate from.
    for (const p of s.pts) {
      const soft = p.deload || p.soft;
      el('circle', {
        cx: px(p.date), cy: py(p.value), r: soft ? 3 : 4,
        fill: soft ? 'var(--surface)' : color, stroke: color, 'stroke-width': 2,
      }, svg);
    }

    // Direct labels: identity never rests on colour alone.
    const last = s.pts[s.pts.length - 1];
    endLabels.push({ y: py(last.value), x: px(last.date) + 10, text: s.label, color });
  }

  // Two lifts finishing at a similar estimate would otherwise print their names
  // over each other; nudge them apart, keeping their order.
  endLabels.sort((a, b) => a.y - b.y);
  for (let i = 1; i < endLabels.length; i++) {
    const gap = endLabels[i].y - endLabels[i - 1].y;
    if (gap < 15) endLabels[i].y = endLabels[i - 1].y + 15;
  }
  for (const l of endLabels) {
    const name = el('text', { x: l.x, y: l.y + 4, class: 'axis', fill: l.color, style: 'font-weight:700' }, svg);
    name.textContent = l.text;
  }

  const cross = el('line', { class: 'crosshair', y1: M.t, y2: H - M.b, opacity: 0 }, svg);
  const tip = document.createElement('div');
  tip.className = 'tip';
  host.append(svg, tip);

  hoverable(svg, tip, {
    onMove(vx, vy, box) {
      let best = dates[0], bd = Infinity;
      for (const d of dates) { const dist = Math.abs(px(d) - vx); if (dist < bd) { bd = dist; best = d; } }
      cross.setAttribute('x1', px(best)); cross.setAttribute('x2', px(best)); cross.setAttribute('opacity', 1);
      const rows = series.map((s) => {
        const p = s.pts.find((q) => q.date === best);
        return p ? `<div class="tip__r"><span style="display:inline-flex;align-items:center;gap:6px">
          <span class="dot" style="background:${LIFT_COLOR[s.lift]}"></span>${esc(s.label)}</span>
          <b>${fmt(p.value)}${p.deload || p.soft ? '*' : ''}</b></div>` : '';
      }).join('');
      tip.innerHTML = `<div class="tip__t">${esc(fmtDate(best, { day: 'numeric', month: 'short', year: 'numeric' }))}</div>${rows || '<div class="tip__r">no lifts</div>'}`;
      placeTip(tip, svg, box, px(best), M.t);
    },
    onLeave() { cross.setAttribute('opacity', 0); },
  });

  const soft = all.some((p) => p.deload || p.soft);
  if (soft) {
    const n = document.createElement('p');
    n.className = 'note';
    n.textContent = 'Hollow points are estimates the app does not fully trust — a deload week, '
      + 'or a set with too many reps to extrapolate a single-rep max from. They are plotted for '
      + 'completeness but excluded from the headline numbers above.';
    host.appendChild(n);
  }
}

/* ---- 3. weekly volume ------------------------------------------------- */

function volumeChart(host) {
  const byWeek = new Map();
  for (const s of DATA.sessions) {
    const k = isoWeekKey(s.date);
    const w = byWeek.get(k) || { week: k, tonnage: 0, sessions: 0, deload: true };
    w.tonnage += s.tonnage || 0;
    w.sessions += 1;
    if (s.phase !== 'deload') w.deload = false;
    byWeek.set(k, w);
  }
  const weeks = [...byWeek.values()].sort((a, b) => (a.week < b.week ? -1 : 1)).slice(-18);
  if (!weeks.length) { host.innerHTML = '<p class="note">No sessions logged yet.</p>'; return; }

  const hi = Math.max(...weeks.map((w) => w.tonnage)) * 1.08 || 1;
  const W = plotWidth(host), H = 240, M = { t: 12, r: 12, b: 34, l: 52 };
  const bw = (W - M.l - M.r) / weeks.length;
  const py = (v) => M.t + (1 - v / hi) * (H - M.t - M.b);

  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img',
    'aria-label': 'Total weight lifted per week.' });

  for (const t of ticks(0, hi, 3)) {
    el('line', { x1: M.l, x2: W - M.r, y1: py(t), y2: py(t), class: 'grid-line' }, svg);
    const lab = el('text', { x: M.l - 8, y: py(t) + 4, class: 'axis axis--mono', 'text-anchor': 'end' }, svg);
    lab.textContent = compact(toDisplay(t));
  }

  const tip = document.createElement('div');
  tip.className = 'tip';
  const bars = [];
  weeks.forEach((w, i) => {
    // 2px of surface between neighbouring bars, and a rounded data-end.
    const x = M.l + i * bw + 1;
    const wd = Math.max(bw - 2, 1);
    const y = py(w.tonnage);
    const h = Math.max(H - M.b - y, 2);
    const r = el('rect', {
      x, y, width: wd, height: h, rx: Math.min(4, wd / 2),
      fill: w.deload ? 'var(--surface-3)' : 'var(--accent)',
      stroke: w.deload ? 'var(--line)' : 'none', 'stroke-width': w.deload ? 1 : 0,
    }, svg);
    bars.push({ ...w, x: x + wd / 2, y, rect: r });
  });

  // Draw right-to-left so the most recent week always gets its label, and drop
  // any that would crowd the one already placed.
  let lastX = Infinity;
  for (let i = weeks.length - 1; i >= 0; i--) {
    const x = M.l + i * bw + bw / 2;
    if (lastX - x < 62) continue;
    lastX = x;
    const lab = el('text', { x, y: H - 12, class: 'axis', 'text-anchor': 'middle' }, svg);
    lab.textContent = fmtDate(weeks[i].week);
  }

  host.append(svg, tip);
  hoverable(svg, tip, {
    onMove(vx, vy, box) {
      let best = bars[0], bd = Infinity;
      for (const b of bars) { const d = Math.abs(b.x - vx); if (d < bd) { bd = d; best = b; } }
      for (const b of bars) b.rect.setAttribute('opacity', b === best ? 1 : 0.55);
      tip.innerHTML = `<div class="tip__t">Week of ${esc(fmtDate(best.week, { day: 'numeric', month: 'short' }))}</div>
        <div class="tip__r"><span>Volume</span><b>${fmtInt(best.tonnage)} ${unit}</b></div>
        <div class="tip__r"><span>Sessions</span><b>${best.sessions}</b></div>
        ${best.deload ? '<div class="tip__r"><span>Deload week</span></div>' : ''}`;
      placeTip(tip, svg, box, best.x, best.y);
    },
    onLeave() { for (const b of bars) b.rect.setAttribute('opacity', 1); },
  });

  if (weeks.some((w) => w.deload)) {
    const n = document.createElement('p');
    n.className = 'note';
    n.textContent = 'Outlined bars are deload weeks — deliberately light, not a drop-off.';
    host.appendChild(n);
  }
}

/* ---- 4. consistency heatmap ------------------------------------------ */

function heatmap(host) {
  const counts = new Map();
  for (const s of DATA.sessions) counts.set(s.date, (counts.get(s.date) || 0) + 1);

  // Fixed cell size, variable span: stretching cells to fill the card turns a
  // heatmap into a wall of blocks. Instead, show as many weeks of history as the
  // card has room for — a year on a laptop, a few months on a phone.
  const CELL = 14, GAP = 3;
  const WEEKS = Math.max(12, Math.min(53, Math.floor(((host.clientWidth || 700) + GAP) / (CELL + GAP))));
  const end = new Date();
  end.setHours(0, 0, 0, 0);
  end.setDate(end.getDate() + ((7 - ((end.getDay() + 6) % 7)) % 7));   // to Sunday
  const start = new Date(end.getTime() - (WEEKS * 7 - 1) * dayMs);

  const grid = document.createElement('div');
  grid.className = 'heat';
  grid.style.gridAutoColumns = `${CELL}px`;
  grid.setAttribute('role', 'img');
  grid.setAttribute('aria-label', `Training days over the last ${WEEKS} weeks.`);

  const tip = document.createElement('div');
  tip.className = 'tip';
  let trained = 0;

  for (let t = start.getTime(); t <= end.getTime(); t += dayMs) {
    const d = new Date(t);
    const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const n = counts.get(iso) || 0;
    if (n) trained++;
    const cell = document.createElement('i');
    // Steps skip h1: one session a day is the norm here, so it needs to read as
    // clearly "trained" rather than as a barely-there tint next to a rest day.
    cell.style.background = n === 0 ? 'var(--h0)' : `var(--h${Math.min(n + 1, 4)})`;
    cell.dataset.iso = iso;
    cell.dataset.n = n;
    grid.appendChild(cell);
  }

  grid.addEventListener('pointermove', (e) => {
    const cell = e.target.closest('i');
    if (!cell) { tip.dataset.on = '0'; return; }
    const n = +cell.dataset.n;
    tip.innerHTML = `<div class="tip__t">${esc(fmtDate(cell.dataset.iso, { weekday: 'short', day: 'numeric', month: 'short' }))}</div>
      <div class="tip__r"><span>${n ? `${n} session${n === 1 ? '' : 's'}` : 'Rest'}</span></div>`;
    tip.dataset.on = '1';
    const box = cell.getBoundingClientRect();
    const host2 = tip.offsetParent.getBoundingClientRect();
    const half = tip.offsetWidth / 2;
    const want = box.left - host2.left + box.width / 2;
    tip.style.left = `${Math.max(half + 4, Math.min(host2.width - half - 4, want))}px`;
    tip.style.top = `${box.top - host2.top - 6}px`;
  });
  grid.addEventListener('pointerleave', () => { tip.dataset.on = '0'; });

  const scale = document.createElement('div');
  scale.className = 'heat__scale';
  scale.innerHTML = `<span>${trained} training days in ${WEEKS} weeks</span>
    <span style="margin-left:auto">Rest</span>
    <i style="background:var(--h0)"></i><i style="background:var(--h2)"></i>
    <i style="background:var(--h3)"></i><i style="background:var(--h4)"></i>
    <span>Busy</span>`;

  host.append(grid, tip, scale);
}

/* ---- 5. RPE calibration ---------------------------------------------- */

function rpeChart(host) {
  // Per-session this line is unreadable noise — a hard single and a back-off set
  // swing the average around for reasons that say nothing about calibration.
  // Weekly means keep the signal (am I working at the prescribed effort?) and
  // drop the jitter.
  const weeks = new Map();
  for (const s of DATA.sessions) {
    if (s.avgRPE == null || s.avgTargetRPE == null) continue;
    const k = isoWeekKey(s.date);
    const w = weeks.get(k) || { date: k, label: null, a: 0, t: 0, n: 0 };
    w.a += s.avgRPE; w.t += s.avgTargetRPE; w.n += 1;
    weeks.set(k, w);
  }
  const pts = [...weeks.values()]
    .sort((a, b) => (a.date < b.date ? -1 : 1))
    .map((w) => ({
      date: w.date,
      label: `Week of ${fmtDate(w.date)}`,
      sessions: w.n,
      avgRPE: w.a / w.n,
      avgTargetRPE: w.t / w.n,
    }));
  if (pts.length < 2) { host.innerHTML = '<p class="note">Needs a couple more weeks of sessions with RPE logged.</p>'; return; }

  const lo = Math.min(...pts.flatMap((p) => [p.avgRPE, p.avgTargetRPE])) - 0.4;
  const hi = Math.max(...pts.flatMap((p) => [p.avgRPE, p.avgTargetRPE])) + 0.4;
  const W = plotWidth(host), H = 220, M = { t: 12, r: W < 420 ? 68 : 84, b: 34, l: 32 };
  const px = (i) => M.l + (pts.length === 1 ? 0.5 : i / (pts.length - 1)) * (W - M.l - M.r);
  const py = (v) => M.t + (1 - (v - lo) / (hi - lo)) * (H - M.t - M.b);

  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img',
    'aria-label': 'Average RPE actually recorded against the RPE prescribed, per session.' });

  for (const t of ticks(lo, hi, 4)) {
    el('line', { x1: M.l, x2: W - M.r, y1: py(t), y2: py(t), class: 'grid-line' }, svg);
    const lab = el('text', { x: M.l - 8, y: py(t) + 4, class: 'axis axis--mono', 'text-anchor': 'end' }, svg);
    lab.textContent = t.toFixed(1);
  }

  // Prescribed is a reference, not a competing entity, so it is a neutral dashed
  // line rather than a second colour.
  const ref = pts.map((p, i) => `${i ? 'L' : 'M'}${px(i).toFixed(1)},${py(p.avgTargetRPE).toFixed(1)}`).join(' ');
  el('path', { d: ref, fill: 'none', stroke: 'var(--text-3)', 'stroke-width': 2,
    'stroke-dasharray': '5 4', 'vector-effect': 'non-scaling-stroke' }, svg);
  const lastP = pts[pts.length - 1];
  // The two lines converge by design when calibration is good, so their labels
  // have to be positioned as a pair rather than each at its own line's height.
  let yRef = py(lastP.avgTargetRPE);
  let yAct = py(lastP.avgRPE);
  if (Math.abs(yRef - yAct) < 15) {
    const mid = (yRef + yAct) / 2;
    if (lastP.avgRPE >= lastP.avgTargetRPE) { yAct = mid - 8; yRef = mid + 8; }
    else { yRef = mid - 8; yAct = mid + 8; }
  }
  const refLab = el('text', { x: px(pts.length - 1) + 10, y: yRef + 4,
    class: 'axis', fill: 'var(--text-3)', style: 'font-weight:700' }, svg);
  refLab.textContent = 'Prescribed';

  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${px(i).toFixed(1)},${py(p.avgRPE).toFixed(1)}`).join(' ');
  el('path', { d: line, fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2,
    'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'vector-effect': 'non-scaling-stroke' }, svg);
  for (const [i, p] of pts.entries()) {
    el('circle', { cx: px(i), cy: py(p.avgRPE), r: 4, fill: 'var(--accent)',
      stroke: 'var(--surface)', 'stroke-width': 2 }, svg);
  }
  const actLab = el('text', { x: px(pts.length - 1) + 10, y: yAct + 4,
    class: 'axis', fill: 'var(--accent)', style: 'font-weight:700' }, svg);
  actLab.textContent = 'Actual';

  const cross = el('line', { class: 'crosshair', y1: M.t, y2: H - M.b, opacity: 0 }, svg);
  const tip = document.createElement('div');
  tip.className = 'tip';
  host.append(svg, tip);

  hoverable(svg, tip, {
    onMove(vx, vy, box) {
      let bi = 0, bd = Infinity;
      pts.forEach((p, i) => { const d = Math.abs(px(i) - vx); if (d < bd) { bd = d; bi = i; } });
      const p = pts[bi];
      cross.setAttribute('x1', px(bi)); cross.setAttribute('x2', px(bi)); cross.setAttribute('opacity', 1);
      const gap = p.avgRPE - p.avgTargetRPE;
      tip.innerHTML = `<div class="tip__t">${esc(p.label || fmtDate(p.date))}</div>
        <div class="tip__r"><span>Sessions</span><b>${p.sessions}</b></div>
        <div class="tip__r"><span>Actual</span><b>${p.avgRPE.toFixed(1)}</b></div>
        <div class="tip__r"><span>Prescribed</span><b>${p.avgTargetRPE.toFixed(1)}</b></div>
        <div class="tip__r"><span>${gap > 0.05 ? 'Harder than planned' : gap < -0.05 ? 'Easier than planned' : 'On target'}</span>
        <b>${gap > 0 ? '+' : ''}${gap.toFixed(1)}</b></div>`;
      placeTip(tip, svg, box, px(bi), M.t);
    },
    onLeave() { cross.setAttribute('opacity', 0); },
  });

  const avgGap = pts.reduce((n, p) => n + (p.avgRPE - p.avgTargetRPE), 0) / pts.length;
  const n = document.createElement('p');
  n.className = 'note';
  n.textContent = 'One point per week. ' + (Math.abs(avgGap) < 0.25
    ? `Well calibrated — sessions average ${avgGap >= 0 ? '+' : ''}${avgGap.toFixed(2)} RPE against what was prescribed.`
    : avgGap > 0
      ? `Sessions run ${avgGap.toFixed(2)} RPE harder than prescribed on average — the loads may be running ahead of the plan.`
      : `Sessions run ${Math.abs(avgGap).toFixed(2)} RPE easier than prescribed on average — there may be room to add weight.`);
  host.appendChild(n);
}

function bodyweightChart(host) {
  const pts = DATA.bodyweight.filter((b) => b.kg > 0);
  const lo = Math.min(...pts.map((p) => p.kg)) * 0.985;
  const hi = Math.max(...pts.map((p) => p.kg)) * 1.015;
  const t0 = parseDate(pts[0].date).getTime();
  const spanT = Math.max(parseDate(pts[pts.length - 1].date).getTime() - t0, dayMs);
  const W = plotWidth(host), H = 200, M = { t: 12, r: 16, b: 32, l: 46 };
  const px = (iso) => M.l + ((parseDate(iso).getTime() - t0) / spanT) * (W - M.l - M.r);
  const py = (v) => M.t + (1 - (v - lo) / (hi - lo)) * (H - M.t - M.b);

  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img',
    'aria-label': 'Bodyweight over time.' });
  for (const t of ticks(lo, hi, 3)) {
    el('line', { x1: M.l, x2: W - M.r, y1: py(t), y2: py(t), class: 'grid-line' }, svg);
    const lab = el('text', { x: M.l - 8, y: py(t) + 4, class: 'axis axis--mono', 'text-anchor': 'end' }, svg);
    lab.textContent = fmt(t, 1);
  }
  const xl = pts.length > 2 ? [pts[0], pts[Math.floor(pts.length / 2)], pts[pts.length - 1]] : pts;
  for (const p of xl) {
    const lab = el('text', { x: px(p.date), y: H - 10, class: 'axis', 'text-anchor': 'middle' }, svg);
    lab.textContent = fmtDate(p.date);
  }

  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${px(p.date).toFixed(1)},${py(p.kg).toFixed(1)}`).join(' ');
  el('path', { d: `${line} L${px(pts[pts.length - 1].date)},${H - M.b} L${px(pts[0].date)},${H - M.b} Z`,
    fill: 'var(--accent)', opacity: 0.12 }, svg);
  el('path', { d: line, fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2,
    'stroke-linecap': 'round', 'vector-effect': 'non-scaling-stroke' }, svg);
  for (const p of pts) el('circle', { cx: px(p.date), cy: py(p.kg), r: 4,
    fill: 'var(--accent)', stroke: 'var(--surface)', 'stroke-width': 2 }, svg);

  const tip = document.createElement('div');
  tip.className = 'tip';
  host.append(svg, tip);
  hoverable(svg, tip, {
    onMove(vx, vy, box) {
      let best = pts[0], bd = Infinity;
      for (const p of pts) { const d = Math.abs(px(p.date) - vx); if (d < bd) { bd = d; best = p; } }
      tip.innerHTML = `<div class="tip__t">${esc(fmtDate(best.date, { day: 'numeric', month: 'short', year: 'numeric' }))}</div>
        <div class="tip__r"><span>Bodyweight</span><b>${fmt(best.kg)} ${unit}</b></div>`;
      placeTip(tip, svg, box, px(best.date), py(best.kg));
    },
  });
}

/**
 * Re-measure on resize. Guarded on width: mobile browsers fire resize when the
 * URL bar hides, and re-rendering the whole page mid-scroll is both wasteful
 * and visibly janky.
 */
let lastWidth = window.innerWidth;
let resizeTimer = null;
window.addEventListener('resize', () => {
  if (window.innerWidth === lastWidth) return;
  lastWidth = window.innerWidth;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (DATA) render(); }, 160);
});

function wireControls() {
  for (const b of document.querySelectorAll('[data-unit]')) {
    b.onclick = () => { unit = b.dataset.unit; localStorage.setItem('dash:unit', unit); render(); };
  }
  const cur = document.documentElement.dataset.theme;
  for (const b of document.querySelectorAll('[data-theme]')) {
    b.setAttribute('aria-pressed', String(cur === b.dataset.theme));
    b.onclick = () => {
      const next = cur === b.dataset.theme ? 'auto' : b.dataset.theme;
      document.documentElement.dataset.theme = next;
      localStorage.setItem('dash:theme', next);
      render();
    };
  }
}

/* ---- boot ------------------------------------------------------------ */

try {
  unit = localStorage.getItem('dash:unit') || 'kg';
  document.documentElement.dataset.theme = localStorage.getItem('dash:theme') || 'auto';
} catch (e) { /* private browsing; defaults are fine */ }

try {
  // Cache-busted: the whole point of this page is that it is current.
  const res = await fetch(`./data/stats.json?t=${Date.now()}`, { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  DATA = await res.json();
  if (!DATA.lifts) throw new Error('unexpected shape');
  render();
} catch (err) {
  $('#app').innerHTML = `<div class="empty"><h1 style="font-size:1.3rem;margin-bottom:10px">Nothing to show yet</h1>
    <p class="sub">The stats file could not be read (${esc(err.message)}).
    It appears once the training app has synced at least once.</p></div>`;
}
</script>
</body>
</html>
